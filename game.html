<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل اللعبة - أُنَيسِيان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=41">
    <script src="js/data.js?v=41" defer></script>
    <script src="js/game.js?v=41" defer></script>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">أُنَيسِيان</a>
        </div>
    </header>

    <!-- Game Header Section -->
    <section class="game-header" id="game-header">
        <div class="game-header-overlay">
            <div class="container game-header-content">
                <div class="game-cover-wrapper">
                    <img src="" alt="Game Cover" id="game-cover" class="game-detail-cover">
                </div>
                <div class="game-primary-info">
                    <h1 id="game-title">جاري التحميل...</h1>
                    <p class="game-category" id="game-category"></p>
                    <div class="game-meta">
                        <span id="game-status" class="status-badge"></span>
                        <span class="date-badge" id="game-date"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Game Content Section -->
    <section class="game-details-section">
        <div class="container">
            <div class="main-details" style="max-width: 900px; margin: 0 auto; width: 100%;">
                
                <h2 class="section-title">وصف اللعبة</h2>
                <p class="game-description" id="game-description"></p>

                <div id="loc-team-section" style="display: none; margin-top: 3rem;">
                    <h2 class="section-title">فريق التعريب</h2>
                    <div class="loc-team-list" id="loc-team-grid"></div>
                </div>

                <div id="game-progress-container" style="margin-top: 3rem;"></div>

                <div id="download-section" style="display: none; margin-top: 3rem;">
                    <h2 class="section-title">روابط التحميل</h2>
                    <div class="download-buttons" id="download-buttons" style="padding: 0 1rem;"></div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <span class="footer-logo">أُنَيسِيان</span>
            <p>&copy; 2026 أُنَيسِيان. جميع الحقوق محفوظة.</p>
        </div>
    </footer>
</body>
</html>
