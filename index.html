<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أُنَيسِيان</title>
    <!-- Google Fonts for Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=42">
    <!-- Optional Cache buster for JS -->
    <script src="js/data.js?v=42" defer></script>
    <script src="js/main.js?v=42" defer></script>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">أُنَيسِيان</a>
        </div>
    </header>

    <!-- Hero Section (Slider + Dynamic Progress Card) -->
    <section class="hero-section">
        <!-- Slider Container -->
        <div class="hero-slider" id="hero-slider">
            <!-- Slider images injected by JS -->
        </div>

        <!-- Dynamic Overlay Progress Card -->
        <div class="progress-overlay-container">
            <div class="card-positioning" id="hero-progress-card-container">
                <!-- Progress Cards will be dynamically injected here -->
            </div>
        </div>
        
        <!-- Slider Controls -->
        <div class="slider-controls">
            <button id="prev-slide" class="slider-btn">&#10095;</button>
            <button id="next-slide" class="slider-btn">&#10094;</button>
        </div>
        <div class="slider-dots" id="slider-dots"></div>
    </section>

    <!-- Games Library Section -->
    <section class="games-library" id="library">
        <div class="container">
            <div class="games-grid" id="games-grid">
                <!-- Game cards injected by JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <span class="footer-logo">أُنَيسِيان</span>
            <p>&copy; 2026 أُنَيسِيان. جميع الحقوق محفوظة.</p>
        </div>
    </footer>
</body>
</html>
